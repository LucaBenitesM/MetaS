name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meta
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: meta_ads_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meta -d meta_ads_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_MODE: demo
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://meta:ci_only@localhost:5432/meta_ads_test' || 'sqlite:///./ci.db' }}
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://meta:ci_only@localhost:5432/meta_ads_test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start demo services
        run: |
          cd apps/api
          alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/meta-api.log 2>&1 &
          cd ../web
          npm start > /tmp/meta-web.log 2>&1 &
      - name: Wait for readiness
        run: |
          for endpoint in http://127.0.0.1:8000/health http://127.0.0.1:3000; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$endpoint" > /dev/null; then break; fi
              sleep 2
            done
            curl --fail --silent "$endpoint" > /dev/null
          done
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:3000
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
