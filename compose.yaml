name: meta-ads-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-meta_ads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      APP_MODE: demo
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meta:demo_local_password@db:5432/meta_ads}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR: /app/data/uploads
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    profiles: [optimizer]
    build: ./apps/api
    command: [python, -m, app.worker, --interval, '900']
    environment:
      APP_MODE: demo
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meta:demo_local_password@db:5432/meta_ads}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
